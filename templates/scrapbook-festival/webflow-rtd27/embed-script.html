<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><filter id="rough-ink" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7" result="noise"/>
<feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
<script>

/* ROCKING THE DAISIES 2027 · MEMORIES THAT STICK — interactions (vanilla, no dependencies). Hooks onto data-attributes so it survives Webflow class renames. */
(() => {
  "use strict";

  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  const finePointer = window.matchMedia("(hover: hover) and (pointer: fine)");
  const STICKER_URLS = {"smiley": "https://cdn.prod.website-files.com/6ace5c0da0bb66017f9854b5/6ad7454c0a85d7724f2a0291_rtd-smiley.webp", "star-clay": "https://cdn.prod.website-files.com/6ace5c0da0bb66017f9854b5/6ad745898235fefae19bfbfe_rtd-star-clay.webp", "sunflower": "https://cdn.prod.website-files.com/6ace5c0da0bb66017f9854b5/6ad7458925bf33d6c133455a_rtd-sunflower.webp", "button-heart": "https://cdn.prod.website-files.com/6ace5c0da0bb66017f9854b5/6ad745888b4deaa88ced7c77_rtd-button-heart.webp", "star-denim-b": "https://cdn.prod.website-files.com/6ace5c0da0bb66017f9854b5/6ad74589ac471138b37013a4_rtd-star-denim-b.webp", "fish": "https://cdn.prod.website-files.com/6ace5c0da0bb66017f9854b5/6ad7458825bf33d6c13344b0_rtd-fish.webp", "button-round": "https://cdn.prod.website-files.com/6ace5c0da0bb66017f9854b5/6ad7458843970997abe1bdd3_rtd-button-round.webp", "star-painted": "https://cdn.prod.website-files.com/6ace5c0da0bb66017f9854b5/6ad7458981ebadd8012909c8_rtd-star-painted.webp"};

  const seeded = (seed) => () => {
    seed = (seed * 16807) % 2147483647;
    return (seed - 1) / 2147483646;
  };

  /* link-buttons (Webflow) */
  $$("a[data-fav], a[data-filter-day], a[data-filter-stage], a[data-btn], a[data-nav-toggle], a[data-nav-close], a.zine_tab, a[data-picks-only], [data-postcard] a.button").forEach((a) => {
    const href = a.getAttribute("href");
    if (href === "#" || href === "") a.removeAttribute("href");
    a.addEventListener("click", (e) => { if (!a.getAttribute("href")) e.preventDefault(); });
    if (!a.hasAttribute("href")) {
      if (!a.hasAttribute("role")) a.setAttribute("role", "button");
      if (!a.hasAttribute("tabindex")) a.tabIndex = 0;
    }
    a.addEventListener("keydown", (e) => {
      if (e.key === " " || e.key === "Enter") { e.preventDefault(); a.click(); }
    });
  });

  /* toast */
  const toastEl = $("[data-toast]");
  let toastTimer;
  function toast(message) {
    if (!toastEl) return;
    toastEl.textContent = message;
    toastEl.hidden = false;
    toastEl.classList.add("is-visible");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("is-visible"), 3600);
  }

  /* ransom headlines */
  $$("[data-ransom]").forEach((el, n) => {
    const text = el.textContent.trim();
    const rand = seeded(97 + n * 31 + text.length);
    const words = text.split(/\s+/).map((word) => {
      const tiles = Array.from(word).map((ch, i) => {
        const v = 1 + Math.floor(rand() * 8);
        const r = (rand() * 10 - 5).toFixed(1);
        const y = (rand() * 6 - 3).toFixed(1);
        const k = (0.88 + rand() * 0.24).toFixed(2);
        const taped = rand() < 0.16 ? " is-taped" : "";
        return `<span class="ransom_tile is-v${v}${taped}" style="--r:${r}deg;--y:${y}px;--k:${k}em">${ch}</span>`;
      });
      return `<span class="ransom_word">${tiles.join("")}</span>`;
    });
    el.innerHTML = `<span class="visually-hidden">${text}</span><span aria-hidden="true" style="display:contents">${words.join("")}</span>`;
  });

  /* countdown */
  const gates = new Date("2027-10-02T12:00:00+02:00");
  function tick() {
    const ms = gates - Date.now();
    const days = Math.max(0, Math.floor(ms / 86400000));
    const label = ms <= 0 ? "Gates are open" : days === 1 ? "1 day" : `${days} days`;
    $$("[data-countdown]").forEach((el) => (el.textContent = label));
  }
  tick();
  setInterval(tick, 60000);

  /* nav */
  const nav = $("[data-nav]");
  const sheet = $("[data-nav-sheet]");
  const toggle = $("[data-nav-toggle]");
  let lastY = window.scrollY;

  window.addEventListener(
    "scroll",
    () => {
      const y = window.scrollY;
      if (nav && sheet && sheet.hidden) nav.classList.toggle("is-hidden", y > lastY && y > 320);
      lastY = y;
    },
    { passive: true }
  );

  function openSheet() {
    sheet.hidden = false;
    sheet.classList.add("is-open");
    toggle.setAttribute("aria-expanded", "true");
    document.documentElement.style.overflow = "hidden";
    $(".nav_sheet-link", sheet)?.focus();
  }

  function closeSheet(returnFocus = true) {
    sheet.hidden = true;
    sheet.classList.remove("is-open");
    toggle.setAttribute("aria-expanded", "false");
    document.documentElement.style.overflow = "";
    if (returnFocus) toggle.focus();
  }

  if (sheet && toggle) {
    toggle.addEventListener("click", openSheet);
    $("[data-nav-close]", sheet)?.addEventListener("click", () => closeSheet());
    $$("a", sheet).forEach((a) => a.addEventListener("click", () => closeSheet(false)));
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && !sheet.hidden) closeSheet();
      if (e.key === "Tab" && !sheet.hidden) {
        const focusables = $$("a, button", sheet);
        const first = focusables[0];
        const last = focusables[focusables.length - 1];
        if (e.shiftKey && document.activeElement === first) {
          e.preventDefault();
          last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
          e.preventDefault();
          first.focus();
        }
      }
    });
  }

  const navLinks = $$(".nav_link");
  if ("IntersectionObserver" in window && navLinks.length) {
    const spy = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) return;
          navLinks.forEach((a) => a.setAttribute("aria-current", String(a.hash === `#${entry.target.id}`)));
        });
      },
      { rootMargin: "-45% 0px -50% 0px" }
    );
    navLinks.forEach((a) => {
      const target = document.getElementById(a.hash.slice(1));
      if (target) spy.observe(target);
    });
  }

  /* tilt toward cursor */
  function bindTilt(el) {
    let frame;
    el.addEventListener("pointermove", (e) => {
      if (!finePointer.matches || reduceMotion.matches) return;
      cancelAnimationFrame(frame);
      frame = requestAnimationFrame(() => {
        const box = el.getBoundingClientRect();
        const x = (e.clientX - box.left) / box.width - 0.5;
        const y = (e.clientY - box.top) / box.height - 0.5;
        el.classList.add("is-tilting");
        el.style.setProperty("--tilt-x", `${(-y * 9).toFixed(2)}deg`);
        el.style.setProperty("--tilt-y", `${(x * 11).toFixed(2)}deg`);
      });
    });
    el.addEventListener("pointerleave", () => {
      cancelAnimationFrame(frame);
      el.classList.remove("is-tilting");
      el.style.removeProperty("--tilt-x");
      el.style.removeProperty("--tilt-y");
    });
  }
  $$("[data-tilt]").forEach(bindTilt);

  /* hero: stick a sticker down */
  const hero = $("[data-hero]");
  const drops = $("[data-drops]");
  const dropSet = ["smiley", "star-clay", "sunflower", "button-heart", "star-denim-b", "fish", "button-round", "star-painted"];
  let dropCount = 0;
  if (hero && drops) {
    hero.addEventListener("click", (e) => {
      if (e.target.closest("a, button, .note-paper, .polaroid")) return;
      const box = hero.getBoundingClientRect();
      const img = document.createElement("img");
      img.className = "scrapbook-hero_drop";
      img.alt = "";
      img.src = STICKER_URLS[dropSet[dropCount % dropSet.length]];
      img.style.left = `${e.clientX - box.left}px`;
      img.style.top = `${e.clientY - box.top}px`;
      img.style.setProperty("--r", `${Math.round(Math.random() * 50 - 25)}deg`);
      drops.appendChild(img);
      dropCount += 1;
      if (drops.children.length > 14) drops.firstElementChild.remove();
    });
  }

  /* line-up filter */
  const grid = $("[data-lineup]");
  if (grid) {
    const items = $$(".lineup_item", grid);
    const blocks = $$("[data-day-block]", grid);
    const countEl = $("[data-lineup-count]");
    const emptyEl = $("[data-lineup-empty]");
    const state = { day: "all", stage: "all" };
    const dayNames = { fri: "Friday", sat: "Saturday", sun: "Sunday" };
    const stageNames = { main: "the Main Stage", beach: "the Beach Club", seeds: "Sowing the Seeds" };

    function apply() {
      const first = new Map(items.map((li) => [li, li.getBoundingClientRect()]));
      let shown = 0;
      items.forEach((li) => {
        const match = (state.day === "all" || li.dataset.day === state.day) && (state.stage === "all" || li.dataset.stage === state.stage);
        li.hidden = !match;
        if (match) shown += 1;
      });
      blocks.forEach((b) => {
        const any = $$(".lineup_item", b).some((li) => !li.hidden);
        b.hidden = !any;
        b.style.display = any ? "" : "none";
      });
      emptyEl.hidden = shown > 0;
      emptyEl.style.display = shown > 0 ? "none" : "block";
      const where = [state.day !== "all" ? `on ${dayNames[state.day]}` : "", state.stage !== "all" ? `at ${stageNames[state.stage]}` : ""].filter(Boolean).join(" ");
      countEl.textContent = state.day === "all" && state.stage === "all" ? `Showing all ${items.length} acts` : `Showing ${shown} ${shown === 1 ? "act" : "acts"} ${where}`;

      if (reduceMotion.matches) return;
      items.forEach((li, i) => {
        if (li.hidden) return;
        const a = first.get(li);
        const b = li.getBoundingClientRect();
        if (!a.width) {
          li.animate([{ transform: "scale(1.15) rotate(6deg)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 420, delay: i * 18, easing: "cubic-bezier(.34,1.56,.64,1)", fill: "backwards" });
          return;
        }
        const dx = a.left - b.left;
        const dy = a.top - b.top;
        if (dx || dy) li.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: "none" }], { duration: 460, easing: "cubic-bezier(.2,.8,.2,1)" });
      });
    }

    $$("[data-filter-day], [data-filter-stage]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const key = btn.dataset.filterDay ? "day" : "stage";
        state[key] = btn.dataset.filterDay || btn.dataset.filterStage;
        $$(key === "day" ? "[data-filter-day]" : "[data-filter-stage]").forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
        apply();
      });
    });
  }

  /* favourites (my picks) */
  const STORE = "rtd27:picks";
  let picks = new Set();
  try {
    picks = new Set(JSON.parse(localStorage.getItem(STORE) || "[]"));
  } catch (_) {}

  const picksCount = $("[data-picks-count]");
  function renderPicks() {
    $$("[data-fav]").forEach((btn) => btn.setAttribute("aria-pressed", String(picks.has(btn.dataset.fav))));
    $$("[data-fav-row]").forEach((row) => row.classList.toggle("is-saved", picks.has(row.dataset.favRow)));
    if (picksCount) picksCount.textContent = picks.size ? `${picks.size} ${picks.size === 1 ? "set" : "sets"} saved` : "No sets saved yet";
    $$(".zine_panel").forEach((panel) => {
      const empty = $(".zine_picks-empty", panel);
      if (empty) {
        empty.hidden = !zine?.classList.contains("is-picks-only") || $$(".zine_slot.is-saved", panel).length > 0;
        empty.style.display = empty.hidden ? "none" : "block";
      }
    });
  }

  document.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-fav]");
    if (!btn) return;
    const id = btn.dataset.fav;
    const name = btn.getAttribute("aria-label").replace(/^Save | to my plan$/g, "");
    if (picks.has(id)) {
      picks.delete(id);
      toast(`Removed ${name} from your picks`);
    } else {
      picks.add(id);
      toast(`Saved ${name} to your picks`);
    }
    try {
      localStorage.setItem(STORE, JSON.stringify([...picks]));
    } catch (_) {}
    renderPicks();
  });

  /* zine tabs (ARIA) */
  const zine = $("[data-zine]");
  if (zine) {
    const tabs = $$('[role="tab"]', zine);
    function select(tab, focus = true) {
      tabs.forEach((t) => {
        const on = t === tab;
        t.setAttribute("aria-selected", String(on));
        t.tabIndex = on ? 0 : -1;
        const panel = document.getElementById(t.getAttribute("aria-controls"));
        panel.hidden = !on;
        if (on && !reduceMotion.matches) {
          panel.classList.remove("is-turning");
          void panel.offsetWidth;
          panel.classList.add("is-turning");
        }
      });
      zine.style.setProperty("--tab-color", getComputedStyle(tab).backgroundColor);
      if (focus) tab.focus();
      renderPicks();
    }
    tabs.forEach((tab, i) => {
      tab.addEventListener("click", () => select(tab, false));
      tab.addEventListener("keydown", (e) => {
        const map = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: tabs.length - 1 };
        if (!(e.key in map)) return;
        e.preventDefault();
        select(tabs[(map[e.key] + tabs.length) % tabs.length]);
      });
    });
    zine.style.setProperty("--tab-color", getComputedStyle(tabs[0]).backgroundColor);
    tabs.forEach((t, i) => { const pnl = document.getElementById(t.getAttribute("aria-controls")); if (pnl) pnl.hidden = i !== 0; });

    $("[data-picks-only]")?.addEventListener("click", (e) => {
      e.preventDefault();
      const btn = e.currentTarget;
      const on = btn.getAttribute("aria-pressed") !== "true";
      btn.setAttribute("aria-pressed", String(on));
      zine.classList.toggle("is-picks-only", on);
      renderPicks();
    });
  }
  renderPicks();

  /* ticket tear-off stubs */
  $$("[data-tear]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const stub = btn.closest(".ticket_card")?.querySelector(".ticket_stub");
      if (!stub || reduceMotion.matches || stub.classList.contains("is-torn")) return;
      stub.classList.add("is-torn");
      setTimeout(() => {
        stub.classList.remove("is-torn");
        stub.classList.add("is-back");
        setTimeout(() => stub.classList.remove("is-back"), 600);
      }, 2200);
    });
  });

  /* postcard form */
  const postcard = $("[data-postcard]");
  if (postcard) {
    const email = $("#pc-email", postcard);
    const status = $("[data-postcard-status]", postcard);
    const mark = $("[data-postmark]", postcard);
    const send = postcard.querySelector("a.button");
    const submit = () => (postcard.requestSubmit ? postcard.requestSubmit() : postcard.dispatchEvent(new Event("submit", { bubbles: true, cancelable: true })));
    send?.addEventListener("click", (e) => { e.preventDefault(); submit(); });
    $$("input", postcard).forEach((inp) => inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); submit(); } }));
    postcard.addEventListener("submit", (e) => {
      const value = email.value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(value)) {
        e.preventDefault();
        e.stopPropagation();
        email.setAttribute("aria-invalid", "true");
        status.classList.add("is-error");
        status.textContent = value ? "That email is missing something. Check the bit after the @." : "Add your email so we know where to send it.";
        email.focus();
        return;
      }
      email.removeAttribute("aria-invalid");
      status.classList.remove("is-error");
      status.textContent = "Posted. Schedule changes and announcements will reach you first.";
      mark.classList.remove("is-stamped");
      void mark.getBoundingClientRect();
      mark.classList.add("is-stamped");
      toast("You're on the list. See you at the gate.");
      setTimeout(() => postcard.reset(), 0);
    });
    email.addEventListener("input", () => {
      if (email.getAttribute("aria-invalid")) {
        email.removeAttribute("aria-invalid");
        status.textContent = "";
        status.classList.remove("is-error");
      }
    });
  }

  /* build your weekend: pass -> where you're sleeping -> extras -> total -> Computicket.
     Prices from the process document; pre-pitched tents include passes. */
  const builder = $("[data-build]");
  const buildApi = { pick() {}, total: 0, touched: false, label: null };
  if (builder) {
    const PASS = {
      keepsake: { name: "Keepsake", price: 1690, sub: "Weekend pass, per person" },
      golden: { name: "Golden Hour", price: 3290, sub: "VIP weekend pass, per person" }
    };
    const STAY = {
      patch: { name: "Your Own Patch", price: 590, per: "person", sub: "Camping, bring your own tent. Per person" },
      slow: { name: "Slow Mornings", price: 890, per: "person", sub: "Quieter camping, bring your own tent. Per person" },
      polaroid: { name: "The Polaroid", price: 7200, per: "tent", sleeps: 2 },
      contact: { name: "The Contact Sheet", price: 14400, per: "tent", sleeps: 4 },
      none: { name: "Sorted my own stay", price: 0, per: "none" }
    };
    const EXTRA = {
      shuttle: { name: "Cape Town Return Shuttle", price: 380, sub: "Return trip, per person" },
      locker: { name: "Locker", price: 150, sub: "For the whole weekend" }
    };
    const LIMITS = { people: [1, 10], shuttle: [0, 10], locker: [0, 10] };
    const BUILD_KEY = "rtd27:build";
    const rand = (n) => "R" + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    let st = { pass: "keepsake", people: 1, stay: "patch", shuttle: 0, locker: 0, touched: false, extrasTouched: false };
    try {
      const saved = JSON.parse(localStorage.getItem(BUILD_KEY) || "null");
      if (saved && PASS[saved.pass] && STAY[saved.stay]) {
        Object.keys(LIMITS).forEach((k) => {
          const v = Number(saved[k]);
          if (Number.isFinite(v)) saved[k] = Math.min(LIMITS[k][1], Math.max(LIMITS[k][0], Math.round(v)));
          else delete saved[k];
        });
        st = { ...st, ...saved };
      }
    } catch (_) {}
    const save = () => {
      try { localStorage.setItem(BUILD_KEY, JSON.stringify(st)); } catch (_) {}
    };

    function compute() {
      const lines = [];
      let note = "";
      const p = PASS[st.pass];
      const s = STAY[st.stay];
      if (s.per === "tent") {
        const tents = Math.ceil(st.people / s.sleeps);
        const places = tents * s.sleeps;
        lines.push({ name: `${s.name} × ${tents}`, amount: tents * s.price, sub: `Pre-pitched, sleeps ${s.sleeps}. Includes ${places} Keepsake ${places === 1 ? "pass" : "passes"}` });
        if (st.pass === "golden") {
          const diff = PASS.golden.price - PASS.keepsake.price;
          lines.push({ name: `Golden Hour upgrade × ${places}`, amount: places * diff, sub: `You only pay the difference: ${rand(diff)} per pass` });
        }
        if (places > st.people) note = `${s.name} sleeps ${s.sleeps}, so that's ${tents} ${tents === 1 ? "tent" : "tents"} with room for ${places - st.people} more.`;
      } else {
        lines.push({ name: `${p.name} × ${st.people}`, amount: st.people * p.price, sub: p.sub });
        if (s.per === "person") lines.push({ name: `${s.name} × ${st.people}`, amount: st.people * s.price, sub: s.sub });
        else lines.push({ name: s.name, amount: 0, sub: "No camping booked" });
      }
      ["shuttle", "locker"].forEach((k) => {
        if (st[k] > 0) lines.push({ name: `${EXTRA[k].name} × ${st[k]}`, amount: st[k] * EXTRA[k].price, sub: EXTRA[k].sub });
      });
      const total = lines.reduce((sum, l) => sum + l.amount, 0);
      return { lines, total, note };
    }

    const linesEl = $("[data-build-lines]", builder);
    const totalEl = $("[data-build-total]", builder);
    const summaryEl = $("[data-build-summary]", builder);
    const noteEl = $("[data-build-note]", builder);
    const checkout = $("[data-build-checkout]", builder);
    let lastTotal = null;

    function render() {
      const { lines, total, note } = compute();
      $$("[data-build-pass]", builder).forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.buildPass === st.pass)));
      $$("[data-build-stay]", builder).forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.buildStay === st.stay)));
      Object.keys(LIMITS).forEach((k) => {
        const out = $(`[data-build-out="${k}"]`, builder);
        if (out) out.textContent = st[k];
        const dec = $(`[data-build-dec="${k}"]`, builder);
        const inc = $(`[data-build-inc="${k}"]`, builder);
        dec?.setAttribute("aria-disabled", String(st[k] <= LIMITS[k][0]));
        inc?.setAttribute("aria-disabled", String(st[k] >= LIMITS[k][1]));
      });
      $$(".build_extra", builder).forEach((row) => {
        const k = $("[data-build-stepper]", row)?.dataset.buildStepper;
        row.classList.toggle("is-on", Boolean(k && st[k] > 0));
      });
      linesEl.innerHTML = lines
        .map((l) => `<li class="build_line"><span class="build_line-name">${l.name}</span><span class="build_line-amount">${rand(l.amount)}</span><span class="build_line-sub">${l.sub}</span></li>`)
        .join("");
      totalEl.textContent = rand(total);
      if (lastTotal !== null && lastTotal !== total && !reduceMotion.matches) {
        totalEl.classList.remove("is-bump");
        void totalEl.offsetWidth;
        totalEl.classList.add("is-bump");
      }
      lastTotal = total;
      const who = `${st.people} ${st.people === 1 ? "person" : "people"}`;
      summaryEl.textContent = `${who} · ${PASS[st.pass].name} · ${STAY[st.stay].name}`;
      noteEl.textContent = note;
      checkout.setAttribute("aria-label", `Continue to Computicket to pay ${rand(total)}`);
      $$("[data-build-flow]").forEach((li) => {
        const n = Number(li.dataset.buildFlow);
        const done = n <= 2 || (n === 3 && st.extrasTouched) || (n === 4 && st.touched);
        li.classList.toggle("is-done", done);
      });
      buildApi.total = total;
      buildApi.touched = st.touched;
      buildApi.label?.();
    }

    function set(patch, message) {
      st = { ...st, ...patch, touched: true };
      save();
      render();
      if (message) toast(message);
    }

    builder.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-build-pass], [data-build-stay], [data-build-inc], [data-build-dec]");
      if (!btn || btn.getAttribute("aria-disabled") === "true") return;
      e.preventDefault();
      if (btn.dataset.buildPass) set({ pass: btn.dataset.buildPass });
      else if (btn.dataset.buildStay) set({ stay: btn.dataset.buildStay });
      else {
        const k = btn.dataset.buildInc || btn.dataset.buildDec;
        const step = btn.dataset.buildInc ? 1 : -1;
        const v = Math.min(LIMITS[k][1], Math.max(LIMITS[k][0], st[k] + step));
        set({ [k]: v, extrasTouched: st.extrasTouched || k !== "people" });
      }
    });

    checkout.addEventListener("click", () => {
      const { total } = compute();
      toast(`Opening Computicket. Your total is ${rand(total)}.`);
    });

    buildApi.pick = (patch, message) => set(patch, message);
    $$("[data-build-pick]").forEach((a) =>
      a.addEventListener("click", () => buildApi.pick({ pass: a.dataset.buildPick }, `${PASS[a.dataset.buildPick].name} picked. Now choose where you're sleeping.`))
    );
    $$("[data-build-pick-stay]").forEach((a) =>
      a.addEventListener("click", () => {
        const k = a.dataset.buildPickStay;
        const s = STAY[k];
        const patch = { stay: k };
        if (s.per === "tent" && st.people < s.sleeps) patch.people = s.sleeps;
        buildApi.pick(patch, `${s.name} added to your weekend.`);
      })
    );
    $$("[data-build-pick-extra]").forEach((a) =>
      a.addEventListener("click", () => {
        const k = a.dataset.buildPickExtra;
        buildApi.pick({ [k]: Math.max(st[k], st.people), extrasTouched: true }, `${EXTRA[k].name} added for ${st.people} ${st.people === 1 ? "person" : "people"}.`);
      })
    );
    render();
  }

  /* mobile sticky CTA (Build your weekend) */
  const mobileCta = $("[data-mobile-cta]");
  const heroSection = $(".section_hero");
  const buildSection = $("#build");
  const footer = $(".footer_component");
  const receipt = $("#build-receipt");
  const mobileLink = $("a", mobileCta || document.createElement("div"));
  const seen = new Map();
  const money = (n) => "R" + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  buildApi.label = () => {
    if (!mobileLink || !mobileLink.firstChild) return;
    const inBuild = seen.get(buildSection);
    let text = "Build your weekend";
    if (inBuild) text = `Total ${money(buildApi.total)} · Review`;
    else if (buildApi.touched) text = `Your weekend · ${money(buildApi.total)}`;
    if (mobileLink.firstChild.textContent !== text) mobileLink.firstChild.textContent = text;
    mobileLink.setAttribute("href", inBuild ? "#build-receipt" : "#build");
  };
  if (mobileCta && "IntersectionObserver" in window) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((entry) => seen.set(entry.target, entry.isIntersecting));
      const show = !seen.get(heroSection) && !seen.get(receipt) && !seen.get(footer);
      mobileCta.classList.toggle("is-visible", show);
      buildApi.label();
    });
    [heroSection, buildSection, receipt, footer].forEach((el) => el && io.observe(el));
  }

  /* reveal: stick it down (transform-only, so every block is fully visible before and after) */
  if (!reduceMotion.matches && "IntersectionObserver" in window) {
    const slap = (el, delay = 0) =>
      el.animate(
        [
          { transform: `${getComputedStyle(el).transform === "none" ? "" : getComputedStyle(el).transform} translateY(18px) scale(1.06) rotate(2deg)` },
          { transform: getComputedStyle(el).transform }
        ],
        { duration: 620, delay, easing: "cubic-bezier(.34,1.56,.64,1)" }
      );

    const reveal = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) return;
          reveal.unobserve(entry.target);
          slap(entry.target);
        });
      },
      { threshold: 0.15 }
    );
    $$("[data-reveal], .ticket_card, .faq_note, .polaroid-frame, .hoard_quote, .plan_card, .build_step, .festmap_frame").forEach((el) => {
      const box = el.getBoundingClientRect();
      if (box.top > window.innerHeight) reveal.observe(el);
    });

    $$(".scrapbook-hero .sticker, .scrapbook-hero .stamp, .hero-ticket").forEach((el, i) => {
      el.animate(
        [{ scale: "1.35", translate: "0 -10px" }, { scale: "0.96", offset: 0.7 }, { scale: "1", translate: "0 0" }],
        { duration: 520, delay: 180 + i * 90, easing: "cubic-bezier(.2,.8,.2,1)" }
      );
    });
  }
})();

</script>
